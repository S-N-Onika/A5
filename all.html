<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./tailwind.css">
    <link rel="stylesheet" href="style.css">

    <title>All Issues</title>
</head>

<body class="bg-[#F8FAFC] items-center">
    <header>
        <nav class="xl:lg:flex justify-between items-center px-9 py-4 bg-white sm:grid ">
            <div class="flex items-center gap-2">
                <img class="w-9" src="./img/github-logo.png" alt="">
                <h2 class="font-semibold text-2xl">GitHub Issues Tracker</h2>
            </div>

            <div class="flex gap-4 items-center pt-6 xl:lg:pt-0">
                <div>
                    <i class="fa-brands fa-sistrix absolute p-4" style="color: #64748b;"></i>
                    <input type="search" name="search" id="search" placeholder="Search Issues..."
                        class="pl-9 pr-2 py-2 rounded-md border-gray-300">
                </div>
                <button class="btn btn-primary"><i class="fa-solid fa-plus" style="color: white;"></i>New Issue</button>
            </div>
        </nav>
    </header>

    <main class="bg-[#F8FAFC] space-y-4 mt-4 items-center grid xl:lg:px-60">
    <section id="buttons" class="bg-white rounded-lg w-auto">
            <div class="flex gap-2 pt-4 pb-4 pl-6">
                <button onclick="toggleStyle('all')" id="all"
                    class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl bg-[#3b5fea] text-[#ffffff] rounded-sm text-[12px] w-16 h-10">All</button>
                <button onclick="toggleStyle('opened')" id="opened"
                    class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl bg-[#ffffff] text-[#64748b] rounded-sm text-[12px] w-16 h-10">Open</button>
                <button onclick="toggleStyle('closed')" id="closed"
                    class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl bg-[#ffffff] text-[#64748b] rounded-sm text-[12px] w-16 h-10">Closed</button>
            </div>            
        </section>
        
        <section>
            <div class="flex justify-between items-center p-4 bg-[#ffffff] rounded-lg">
                <div class="flex items-center">
                    <img class="bg-[#ECE4FF] p-2 rounded-full" src="./img/Aperture.png" alt="">
                    <div class="pl-3">
                        <h2 id="issueCount" class="text-[20px] font-semibold">0 Issues</h2>
                        <p class="text-[#64748B]">Track and manage your project issues</p>
                    </div>
                </div>
                <div class="xl:lg:flex grid grid-cols-2 items-center gap-2">
                    <div class="bg-green-600 p-1 rounded-full w-3 h-3 ml-8"></div>
                    <p>Open</p>
                    <div class="bg-purple-600 p-1 rounded-full w-3 h-3 xl:lg:ml-4 ml-8"></div>
                    <p>Closed</p>
                </div>
            </div>
        </section>
        
        <section id="allCards" class="bg-[#FBFBFB] grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 px-10 xl:lg:px-0">
            
            <div id="loadingSpinner" class="h-[60vh] xl:lg:w-[150vh] justify-center items-center hidden">
                <span class="loading loading-spinner loading-xl"></span>
            </div>

        </section>
    </main>

    <script src="./script.js/all.js"></script>
</body>

</html>
